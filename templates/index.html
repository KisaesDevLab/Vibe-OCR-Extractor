<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe OCR Extractor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="container">
    <header>
      <button type="button" id="settings-btn" class="settings-btn" title="Settings" aria-label="Settings">⚙️</button>
      <h1>📄 Vibe OCR Extractor</h1>
      <p class="subtitle">Upload a PDF or image, extract the text with your local GLM-OCR.</p>
      <p class="backend" id="backend-info"></p>
    </header>

    <section id="dropzone" class="dropzone" tabindex="0" aria-label="Upload a file">
      <input type="file" id="file-input" hidden />
      <div class="dropzone-inner">
        <div class="dropzone-icon">⬆️</div>
        <p><strong>Drag &amp; drop</strong> a PDF or image here</p>
        <p class="muted">or <button type="button" id="browse-btn" class="link-btn">browse your files</button></p>
        <p class="muted small" id="accepted-types"></p>
      </div>
    </section>

    <div id="selected-file" class="selected-file hidden">
      <span id="selected-name"></span>
      <button type="button" id="extract-btn" class="primary-btn">Extract text</button>
      <button type="button" id="clear-btn" class="ghost-btn">Clear</button>
    </div>

    <div id="status" class="status hidden"></div>

    <section id="result-section" class="result-section hidden">
      <div class="result-toolbar">
        <h2>Extracted text <span id="page-count" class="muted small"></span></h2>
        <div class="result-actions">
          <button type="button" id="copy-btn" class="ghost-btn">Copy</button>
          <button type="button" id="download-btn" class="primary-btn">⬇ Download .txt</button>
        </div>
      </div>
      <div id="result-meta" class="result-meta hidden"></div>
      <textarea id="result-text" class="result-text" spellcheck="false"></textarea>
    </section>
  </main>

  <!-- Settings dialog -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title">⚙️ Settings</h2>
        <button type="button" id="settings-close" class="icon-btn" aria-label="Close">✕</button>
      </div>

      <form id="settings-form" class="settings-form">
        <label>
          <span>Extraction mode</span>
          <select name="extraction_mode" id="set-extraction_mode">
            <option value="auto">Auto — detect text layer, else OCR (match converter)</option>
            <option value="text">Text layer only — pdf.js, exactly what the converter ingests</option>
            <option value="ocr">OCR only — always rasterize &amp; GLM-OCR</option>
          </select>
          <small id="text-layer-note"></small>
        </label>

        <label>
          <span>GLM-OCR Base URL</span>
          <input type="text" name="base_url" id="set-base_url" placeholder="http://localhost:8080/v1" />
          <small>Your llama.cpp server's OpenAI-compatible endpoint (include <code>/v1</code>).</small>
        </label>

        <label>
          <span>Model name</span>
          <input type="text" name="model" id="set-model" placeholder="glm-ocr" />
        </label>

        <label>
          <span>API key</span>
          <input type="password" name="api_key" id="set-api_key" placeholder="EMPTY" autocomplete="off" />
          <small>Usually ignored by llama.cpp. Leave as <code>EMPTY</code> if unsure.</small>
        </label>

        <div class="field-row">
          <label>
            <span>PDF render DPI</span>
            <input type="number" name="pdf_dpi" id="set-pdf_dpi" min="50" max="600" step="10" />
            <small>Higher = sharper but slower (50–600).</small>
          </label>
          <label>
            <span>Timeout (seconds)</span>
            <input type="number" name="timeout" id="set-timeout" min="5" max="1800" step="5" />
            <small>Per page (5–1800).</small>
          </label>
        </div>

        <label>
          <span>OCR prompt</span>
          <textarea name="prompt" id="set-prompt" rows="4"></textarea>
        </label>

        <div id="settings-status" class="settings-status hidden"></div>

        <div class="modal-actions">
          <button type="button" id="test-btn" class="ghost-btn">🔌 Test connection</button>
          <span class="spacer"></span>
          <button type="button" id="reset-btn" class="ghost-btn">Reset to defaults</button>
          <button type="submit" id="save-btn" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
